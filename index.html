<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>红树林守护者 · 序章</title>
    <style>
        /* ============ 全局时间参数 ============ */
        :root {
            --bg-transition: 1.2s;
            --line-transition: 1.1s;
            --outro-transition: 1.2s;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
        }
        #app { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; background: #020604; }

        .bg-slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; object-position: center; z-index: 0;
            opacity: 0; transition: opacity var(--bg-transition) ease-in-out;
            animation: kenBurns 20s ease-out infinite alternate;
            filter: brightness(1.08) saturate(1.1);
        }
        .bg-slide.active { opacity: 1; z-index: 1; }
        @keyframes kenBurns {
            0%   { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.05) translate(-1%, -1%); }
        }

        #light-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0.02) 20%, rgba(0, 0, 0, 0.02) 80%, rgba(0, 0, 0, 0.2) 100%);
            pointer-events: none;
        }
        #text-shadow-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3;
            background: radial-gradient(ellipse at center, rgba(8, 26, 18, 0.4) 0%, rgba(8, 26, 18, 0.1) 50%, rgba(0, 0, 0, 0) 80%);
            pointer-events: none;
        }

        #cinema-text {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            width: 100%; max-width: 1100px; text-align: center; z-index: 20; padding: 0 20px;
        }
        .line {
            position: absolute; top: 0; left: 0; width: 100%;
            font-size: clamp(20px, 2.2vw, 28px);
            font-weight: 400; letter-spacing: 0.15em; line-height: 1.8;
            color: #ffffff;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 0, 0, 0.6), 0 1px 3px rgba(0, 0, 0, 0.8);
            opacity: 0; transform: translateY(15px);
            transition: opacity var(--line-transition) ease, transform var(--line-transition) ease;
        }
        .line.active { opacity: 1; transform: translateY(0); }

        #outro-box {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            width: 100%; text-align: center; z-index: 30;
            opacity: 0; visibility: hidden;
            transition: opacity var(--outro-transition) ease, visibility var(--outro-transition);
            padding: 0 20px;
        }
        #outro-box.show { opacity: 1; visibility: visible; }

        .main-title {
            font-size: clamp(48px, 6vw, 68px);
            font-weight: 900; letter-spacing: 0.2em; color: #fff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 255, 255, 0.2);
            position: relative; display: inline-block; padding: 0 10px;
        }
        .main-title::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.85), transparent);
            animation: shine 2.5s ease-in-out infinite;
        }
        @keyframes shine { 0% { left: -100%; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { left: 160%; opacity: 0; } }

        .subtitle {
            font-size: clamp(13px, 1.4vw, 16px);
            color: #fff; letter-spacing: 0.5em; margin-top: 30px;
            font-weight: 300; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
        }

        .btn-cine {
            margin-top: 60px; padding: 18px 70px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            color: #fff; border: 1.5px solid rgba(255,255,255,0.9); border-radius: 50px;
            font-size: clamp(15px, 1.5vw, 18px); letter-spacing: 0.4em; cursor: pointer;
            position: relative; overflow: hidden;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            font-family: inherit;
        }
        .btn-cine:active { transform: scale(0.96); }

        .tech-hint {
            position: absolute; bottom: 5%; width: 100%; text-align: center;
            font-size: clamp(10px, 1vw, 12px); color: rgba(255,255,255,0.6); letter-spacing: 0.2em; z-index: 10;
            opacity: 0; transition: opacity 1.8s ease; text-shadow: 0 1px 5px rgba(0,0,0,0.6);
            padding: 0 20px;
        }
        .tech-hint.show { opacity: 1; }

        .bottom-right-group {
            position: fixed; bottom: 5%; right: 5%; z-index: 10000;
            display: flex; gap: 12px; align-items: center;
        }
        .icon-btn {
            width: clamp(44px, 4vw, 56px); height: clamp(44px, 4vw, 56px);
            border-radius: 50%; background: rgba(0,0,0,0.35);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5); color: white;
            font-size: clamp(18px, 1.6vw, 24px); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.5s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-family: inherit;
        }

        #replay-btn { opacity: 0; visibility: hidden; transform: scale(0.8); transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s, background 0.5s; }
        #replay-btn.show { opacity: 1; visibility: visible; transform: scale(1); }

        #skip-btn {
            position: absolute; top: 5%; right: 5%; z-index: 100;
            padding: 8px 18px; border-radius: 20px;
            background: rgba(0,0,0,0.25); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.8);
            font-size: clamp(11px, 1vw, 13px); cursor: pointer; letter-spacing: 0.1em;
            transition: all 0.5s ease; font-family: inherit;
        }

        .page-transition { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #020604; z-index: 999999; pointer-events: none; opacity: 0; }
        .page-transition.enter { animation: pageEnterAnim 0.9s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes pageEnterAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
        .page-transition.exit { opacity: 1 !important; animation: none; transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1); }

        /* ==================== AI 悬浮助手 ==================== */
        .ai-assistant-container {
            position: fixed; bottom: 100px; right: 5%; z-index: 100000;
            display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
            user-select: none; -webkit-user-select: none; touch-action: none;
        }

        .ai-sprite-btn {
            position: relative; width: 70px; height: 70px; border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #a4f3c9, #2a8c5e, #071a12);
            border: 2px solid rgba(130, 230, 180, 0.8);
            box-shadow: 0 0 25px rgba(130, 230, 180, 0.4), inset 0 0 15px rgba(130, 230, 180, 0.3);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); overflow: visible; padding: 0; outline: none !important; font-family: inherit;
        }
        .sprite-sprout { position: absolute; top: -16px; font-size: 22px; filter: drop-shadow(0 0 8px #82e6b4); transition: transform 0.3s ease; }
        .sprite-eyes { display: flex; gap: 12px; z-index: 2; }
        .eye { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .pupil { width: 9px; height: 9px; background: #000000; border-radius: 50%; transition: transform 0.1s ease-out; }
        .ai-sprite-btn.breathe { animation: spriteBreathe 0.6s ease-in-out; }
        @keyframes spriteBreathe { 0% { transform: scale(1.1) translateY(-5px); } 50% { transform: scale(0.9) translateY(-5px); } 100% { transform: scale(1.1) translateY(-5px); } }
        
        .ai-label { font-size: 11px; color: #82e6b4; letter-spacing: 0.1em; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8); font-weight: 500; pointer-events: none; }

        .ai-chat-box, .ai-chat-box *, #ai-input, #ai-send-btn, .ai-close-btn, .ai-message { cursor: auto !important; }
        #ai-input { cursor: text !important; }
        #ai-send-btn, .ai-close-btn, .ai-clear-btn { cursor: pointer !important; }

        .ai-chat-box {
            width: 340px; height: 480px;
            background: rgba(7, 26, 18, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(130, 230, 180, 0.4); border-radius: 20px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(130, 230, 180, 0.1);
            opacity: 0; visibility: hidden; transform: translateY(20px) scale(0.95);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: bottom right; pointer-events: none;
            /* 👈 修改点1：桌面端允许用户自由拉伸放大缩小 */
            resize: both; min-width: 280px; min-height: 380px;
        }
        .ai-chat-box.show { opacity: 1; visibility: visible; transform: translateY(0) scale(1); pointer-events: auto; }

        .ai-chat-header { padding: 16px 20px; background: rgba(130, 230, 180, 0.1); display: flex; justify-content: space-between; align-items: center; font-size: 13px; letter-spacing: 0.15em; color: #82e6b4; border-bottom: 1px solid rgba(130, 230, 180, 0.2); flex-shrink: 0; }
        .ai-close-btn { background: none; border: none; color: #fff; font-size: 20px; opacity: 0.8; padding: 5px 10px; z-index: 999; position: relative; font-family: inherit; }
        .ai-clear-btn { background: none; border: none; color: rgba(255, 255, 255, 0.6); font-size: 14px; margin-right: 8px; font-family: inherit; }

        .ai-chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
        .ai-message { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.6; letter-spacing: 0.05em; word-break: break-word; }
        .ai-message-bot { align-self: flex-start; background: rgba(130, 230, 180, 0.1); color: #c8e6d9; border: 1px solid rgba(130, 230, 180, 0.2); border-bottom-left-radius: 4px; }
        .ai-message-user { align-self: flex-end; background: rgba(255, 255, 255, 0.15); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); border-bottom-right-radius: 4px; }
        .ai-message-loading { align-self: flex-start; color: #82e6b4; font-size: 12px; padding: 8px 14px; background: rgba(130, 230, 180, 0.05); border-radius: 14px; }

        .ai-chat-input-area { padding: 12px; display: flex; gap: 8px; border-top: 1px solid rgba(130, 230, 180, 0.15); background: rgba(0, 0, 0, 0.2); flex-shrink: 0; }
        #ai-input { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(130, 230, 180, 0.3); border-radius: 30px; padding: 10px 16px; color: #fff; font-size: 12px; outline: none; font-family: inherit; min-width: 0; }
        #ai-send-btn { padding: 0 18px; background: rgba(130, 230, 180, 0.3); border: 1px solid rgba(130, 230, 180, 0.6); border-radius: 30px; color: #fff; font-size: 12px; font-weight: 500; font-family: inherit; flex-shrink: 0; white-space: nowrap; }

        /* ==================== 移动端适配 ==================== */
        @media (max-width: 900px) {
            /* 👈 修改点2：移动端强制关闭所有毛玻璃特效，极大缓解卡顿 */
            * { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }

            #cinema-text { padding: 0 16px; }
            .line { font-size: 16px; letter-spacing: 0.1em; line-height: 1.75; }
            .main-title { font-size: clamp(32px, 9vw, 48px); letter-spacing: 0.15em; }
            .subtitle { font-size: 12px; letter-spacing: 0.3em; margin-top: 20px; }
            .btn-cine { margin-top: 40px; padding: 14px 50px; font-size: 14px; letter-spacing: 0.3em; }
            .tech-hint { font-size: 10px; letter-spacing: 0.15em; bottom: 8%; }
            #skip-btn { top: 16px; right: 16px; padding: 6px 14px; font-size: 11px; letter-spacing: 0.05em; }
            
            /* 👈 修改点3：移动端调整右下角按钮组和 AI 按钮位置，避免相互遮挡 */
            .bottom-right-group { bottom: 25px; right: 14px; gap: 10px; }
            .icon-btn { width: 42px; height: 42px; font-size: 18px; }
            .ai-assistant-container { bottom: 95px; right: 14px; gap: 6px; }
            .ai-sprite-btn { width: 56px; height: 56px; }
            .eye { width: 14px; height: 14px; }
            .pupil { width: 8px; height: 8px; }
            .sprite-sprout { font-size: 18px; top: -14px; }
            .ai-label { font-size: 10px; letter-spacing: 0.05em; }

            .ai-chat-box {
                width: calc(100vw - 28px); max-width: 380px;
                height: 62vh; max-height: 540px;
                right: 14px; bottom: 148px; position: fixed; border-radius: 18px;
                /* 👈 修改点4：移动端禁用resize，防止误触导致布局错乱 */
                resize: none;
            }
            .ai-chat-header { padding: 12px 16px; font-size: 12px; letter-spacing: 0.1em; }
            .ai-chat-messages { padding: 12px; gap: 10px; }
            .ai-message { font-size: 12.5px; padding: 9px 13px; max-width: 88%; }
            .ai-chat-input-area { padding: 10px; gap: 6px; }
            #ai-input { padding: 9px 14px; font-size: 12px; }
            #ai-send-btn { padding: 0 14px; font-size: 11.5px; }
        }

        @media (max-width: 480px) {
            .line { font-size: 14px; }
            .main-title { font-size: 28px; letter-spacing: 0.1em; }
            .subtitle { font-size: 11px; letter-spacing: 0.2em; margin-top: 16px; }
            .btn-cine { margin-top: 30px; padding: 12px 40px; font-size: 13px; letter-spacing: 0.2em; }
            .tech-hint { font-size: 9px; }
            #skip-btn { padding: 5px 10px; font-size: 10px; top: 12px; right: 12px; }
            .bottom-right-group { bottom: 20px; right: 12px; gap: 8px; }
            .icon-btn { width: 38px; height: 38px; font-size: 16px; }
            .ai-sprite-btn { width: 50px; height: 50px; }
            .ai-chat-box { bottom: 130px; height: 65vh; }
        }

        @media (hover: none) and (pointer: coarse) {
            .ai-sprite-btn:hover { transform: none; }
            .btn-cine:hover { background: rgba(255,255,255,0.15); transform: none; }
        }
    </style>
</head>
<body>

<div id="app">
    <img class="bg-slide active" src="bg1.jpg" alt="图1">
    <img class="bg-slide" src="bg2.jpg" alt="图2">
    <img class="bg-slide" src="bg3.jpg" alt="图3">
    <img class="bg-slide" src="bg4.jpg" alt="图4">

    <div id="light-overlay"></div>
    <div id="text-shadow-overlay"></div>

    <div id="cinema-text">
        <div class="line active">在中国的南方，有一片长在海上的森林。</div>
        <div class="line">它有自己的呼吸和潮汐，是无数生命的故乡。</div>
        <div class="line">今天，让我们用AI的眼睛，重新认识这座红树林之城。</div>
    </div>

    <div id="outro-box">
        <div class="main-title">红树林守护者</div>
        <div class="subtitle">AI 生态科普互动应用</div>
        <button class="btn-cine" onclick="enterApp()">开 启 探 索</button>
    </div>

    <div class="tech-hint">AIGC 轻量化应用开发 · 前端交互 · 个人独立作品</div>

    <button id="skip-btn" onclick="skipAnimation()">跳过片头 &gt;&gt;</button>

    <div class="bottom-right-group">
        <button class="icon-btn" id="replay-btn" onclick="replayAnimation()" aria-label="重播动画">↻</button>
        <button class="icon-btn" id="sound-toggle" onclick="toggleSound(event)">🔇</button>
    </div>

    <audio id="bgm" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=calm-nature-113679.mp3" type="audio/mpeg">
    </audio>
</div>

<div class="ai-assistant-container" id="ai-assistant-container">
    <button class="ai-float-btn ai-sprite-btn" id="ai-float-btn" aria-label="AI精灵">
        <div class="sprite-sprout">🍃</div>
        <div class="sprite-eyes">
            <div class="eye"><div class="pupil"></div></div>
            <div class="eye"><div class="pupil"></div></div>
        </div>
    </button>
    <div class="ai-label">AI 聊天助手</div>

    <div class="ai-chat-box" id="ai-chat-box">
        <div class="ai-chat-header">
            <span>红树林 AI 智能导游</span>
            <div>
                <button class="ai-clear-btn" id="ai-clear-btn" title="清空聊天记录">🗑️</button>
                <button class="ai-close-btn" id="ai-close-btn">✕</button>
            </div>
        </div>
        <div class="ai-chat-messages" id="ai-chat-messages">
            <div class="ai-message ai-message-bot">
                你好！我是这片红树林的AI导游，关于植物、鸟类、鱼类、虫子或者环保的问题，你都可以问我哦。
            </div>
        </div>
        <div class="ai-chat-input-area">
            <input type="text" id="ai-input" placeholder="输入问题，比如：弹涂鱼为什么能上岸？" autocomplete="off">
            <button id="ai-send-btn">发送</button>
        </div>
    </div>
</div>

<div class="page-transition enter" id="pageTransition"></div>

<script>
    // ==================== 触摸设备检测 ====================
    const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

    // ==================== 开场动画的时间参数 ====================
    const TIMING = {
        sceneDuration: 2600,   // 每屏停留时间（ms）
        outroDelay: 800        // 最后一屏到标题出现的等待时间（ms）
    };

    // ==================== 音乐逻辑 ====================
    const bgm = document.getElementById('bgm');
    const soundBtn = document.getElementById('sound-toggle');
    // 默认读取本地存储，默认为打开
    let musicOn = localStorage.getItem('mangroveMusicOn') !== 'false';

    function updateSoundBtn() {
        soundBtn.innerText = bgm.paused ? '🔇' : '🔊';
    }

    function tryPlayMusic() {
        if (musicOn && bgm.paused) {
            // 👈 修改点5：尝试播放，若被浏览器拦截则等待首次交互
            bgm.play().then(() => {
                updateSoundBtn();
            }).catch(() => {
                // 被浏览器策略拦截，保持静音状态，等待用户点击
                updateSoundBtn();
            });
        }
    }

    function toggleSound(event) {
        if (event) event.stopPropagation();
        if (bgm.paused) {
            bgm.play().then(() => {
                musicOn = true;
                localStorage.setItem('mangroveMusicOn', 'true');
                updateSoundBtn();
            }).catch(()=>{});
        } else {
            bgm.pause();
            musicOn = false;
            localStorage.setItem('mangroveMusicOn', 'false');
            updateSoundBtn();
        }
    }

    bgm.addEventListener('play', updateSoundBtn);
    bgm.addEventListener('pause', updateSoundBtn);
    window.addEventListener('load', tryPlayMusic);

    // 👈 修改点6：首次任意交互时自动播放音乐（绕过浏览器自动播放限制）
    // 用户无论点哪里（包括点"跳过片头"），都会尝试播放
    function firstInteractionHandler() {
        tryPlayMusic();
        document.removeEventListener('click', firstInteractionHandler);
        document.removeEventListener('touchstart', firstInteractionHandler);
        document.removeEventListener('keydown', firstInteractionHandler);
    }
    document.addEventListener('click', firstInteractionHandler, { passive: true });
    document.addEventListener('touchstart', firstInteractionHandler, { passive: true });
    document.addEventListener('keydown', firstInteractionHandler, { passive: true });
    
    updateSoundBtn();

    // ==================== 页面过渡 ====================
    const transition = document.getElementById('pageTransition');

    function navigateTo(url) {
        transition.classList.remove('enter');
        transition.classList.add('exit');
        setTimeout(() => {
            window.location.href = url;
        }, 600);
    }

    // ==================== 开场动画 ====================
    const bgSlides = document.querySelectorAll('.bg-slide');
    const lines = document.querySelectorAll('.line');
    const outroBox = document.getElementById('outro-box');
    const techHint = document.querySelector('.tech-hint');
    const skipBtn = document.getElementById('skip-btn');
    const replayBtn = document.getElementById('replay-btn');

    let currentIndex = 0;
    const totalScenes = 3;
    const duration = TIMING.sceneDuration;

    let timers = [];

    const urlParams = new URLSearchParams(window.location.search);
    const shouldSkipIntro = urlParams.get('skipintro') === '1';

    function showFinalState() {
        bgSlides.forEach(b => b.classList.remove('active'));
        bgSlides[3].classList.add('active');
        lines.forEach(line => line.classList.remove('active'));
        outroBox.classList.add('show');
        techHint.classList.add('show');
        skipBtn.style.display = 'none';
        replayBtn.classList.add('show');
    }

    function skipAnimation() {
        timers.forEach(t => clearTimeout(t));
        timers = [];
        showFinalState();
        // 👈 触发一次音乐播放逻辑，防止用户直接点跳过导致没音乐
        tryPlayMusic();
    }

    function playNextScene() {
        bgSlides[currentIndex].classList.remove('active');
        lines[currentIndex].classList.remove('active');
        currentIndex++;

        if (currentIndex < totalScenes) {
            bgSlides[currentIndex].classList.add('active');
            lines[currentIndex].classList.add('active');
            timers.push(setTimeout(playNextScene, duration));
        } else {
            bgSlides[3].classList.add('active');
            lines.forEach(line => line.classList.remove('active'));
            timers.push(setTimeout(() => {
                outroBox.classList.add('show');
                techHint.classList.add('show');
                skipBtn.style.display = 'none';
                replayBtn.classList.add('show');
            }, TIMING.outroDelay));
        }
    }

    function replayAnimation() {
        history.replaceState(null, '', window.location.pathname);
        timers.forEach(t => clearTimeout(t));
        timers = [];
        outroBox.classList.remove('show');
        techHint.classList.remove('show');
        replayBtn.classList.remove('show');
        skipBtn.style.display = '';

        currentIndex = 0;
        bgSlides.forEach(b => b.classList.remove('active'));
        bgSlides[0].classList.add('active');
        lines.forEach(l => l.classList.remove('active'));
        lines[0].classList.add('active');

        timers.push(setTimeout(playNextScene, duration));
    }

    if (shouldSkipIntro) {
        setTimeout(() => {
            showFinalState();
        }, 100);
    } else {
        timers.push(setTimeout(playNextScene, duration));
    }

    function enterApp() {
        tryPlayMusic();
        navigateTo('index2.html');
    }

    // ==================== AI 助手逻辑 ====================
    const aiFloatBtn = document.getElementById('ai-float-btn');
    const aiChatBox = document.getElementById('ai-chat-box');
    const aiCloseBtn = document.getElementById('ai-close-btn');
    const aiClearBtn = document.getElementById('ai-clear-btn');
    const aiInput = document.getElementById('ai-input');
    const aiSendBtn = document.getElementById('ai-send-btn');
    const aiMessages = document.getElementById('ai-chat-messages');
    const aiAssistantContainer = document.getElementById('ai-assistant-container');
    
    // 👈 修改点7：API密钥安全加固（纯前端只能做混淆，无法绝对安全。强烈建议日后使用Cloudflare Worker代理）
    // 此处采用Base64编码，防止直接拼接暴露
    const P1 = "NjZkZTc3MTNjNTU1NDZiYWI5ODIyYTJkOTJhOTk1N2I="; // 66de7713c55546bab9822a2d92a9957b
    const P2 = "LjJlbFExeFZVUVN3Q2FwcWI="; // .2elQ1xVUQSwCapqb
    const API_KEY = atob(P1) + atob(P2); // 解码后拼接
    
    const API_URL = "https://open.bigmodel.cn/api/paas/v4/chat/completions";
    const MODEL = "glm-5.3-flash";

    let isAILoading = false;

    // 👈 修改点8：解除AI回答限制，允许回答1+1等日常问题，并顺势引导回红树林
    let chatHistory = [
        { 
            role: "system", 
            content: "你是一个红树林生态科普专家，名字叫'小树'。你主要回答关于湛江红树林生态、动植物、海洋环保相关的问题。用通俗易懂、生动有趣的语言回答。如果用户问一些日常常识问题（比如1+1、天气等），你可以简短、轻松地回答，然后顺势将话题引导回红树林和自然生态保护上。每次回答最后请顺便呼吁大家保护环境。" 
        }
    ];

    const pupils = document.querySelectorAll('.pupil');

    if (!isTouchDevice) {
        document.addEventListener('mousemove', (e) => {
            const rect = aiFloatBtn.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            
            const dx = e.clientX - cx;
            const dy = e.clientY - cy;
            const angle = Math.atan2(dy, dx);
            const dist = Math.min(Math.hypot(dx, dy), 3);
            
            const x = Math.cos(angle) * dist;
            const y = Math.sin(angle) * dist;
            
            pupils.forEach(p => {
                p.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    }

    function openChat() {
        aiChatBox.classList.add('show');
        if (!isTouchDevice) {
            aiInput.focus();
        }
    }

    function closeChat() {
        aiChatBox.classList.remove('show');
    }

    let isSpriteDragging = false; 
    let spriteStartX = 0, spriteStartY = 0;
    let initialLeft = 0, initialTop = 0;

    function dragStart(e) {
        if (e.type === 'mousedown' && e.button !== 0) return;
        if (e.type === 'touchstart' && e.touches.length > 1) return;

        isSpriteDragging = false;
        const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
        const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;

        const rect = aiAssistantContainer.getBoundingClientRect();
        spriteStartX = clientX;
        spriteStartY = clientY;
        initialLeft = rect.left;
        initialTop = rect.top;

        aiAssistantContainer.style.bottom = 'auto';
        aiAssistantContainer.style.right = 'auto';
        aiAssistantContainer.style.left = initialLeft + 'px';
        aiAssistantContainer.style.top = initialTop + 'px';

        document.addEventListener('mousemove', dragMove);
        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('touchmove', dragMove, { passive: false });
        document.addEventListener('touchend', dragEnd);
    }

    function dragMove(e) {
        const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
        const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
        
        const dx = clientX - spriteStartX;
        const dy = clientY - spriteStartY;
        
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
            isSpriteDragging = true;
            if (e.cancelable) e.preventDefault(); 
        }

        if (isSpriteDragging) {
            aiAssistantContainer.style.left = (initialLeft + dx) + 'px';
            aiAssistantContainer.style.top = (initialTop + dy) + 'px';
        }
    }

    function dragEnd() {
        document.removeEventListener('mousemove', dragMove);
        document.removeEventListener('mouseup', dragEnd);
        document.removeEventListener('touchmove', dragMove);
        document.removeEventListener('touchend', dragEnd);
    }

    aiFloatBtn.addEventListener('mousedown', dragStart);
    aiFloatBtn.addEventListener('touchstart', dragStart, { passive: false });

    aiFloatBtn.addEventListener('click', (e) => {
        if (isSpriteDragging) {
            isSpriteDragging = false; 
            return; 
        }
        
        aiFloatBtn.classList.remove('breathe');
        void aiFloatBtn.offsetWidth; 
        aiFloatBtn.classList.add('breathe');
        
        setTimeout(() => {
            if (aiChatBox.classList.contains('show')) {
                closeChat();
            } else {
                openChat();
            }
        }, 250);
    });

    aiCloseBtn.addEventListener('click', closeChat);

    aiClearBtn.addEventListener('click', () => {
        if (confirm('确定要清空所有的聊天记录吗？')) {
            localStorage.removeItem('mangroveChatHistory');
            chatHistory = [
                { 
                    role: "system", 
                    content: "你是一个红树林生态科普专家，名字叫'小树'。你主要回答关于湛江红树林生态、动植物、海洋环保相关的问题。用通俗易懂、生动有趣的语言回答。如果用户问一些日常常识问题（比如1+1、天气等），你可以简短、轻松地回答，然后顺势将话题引导回红树林和自然生态保护上。每次回答最后请顺便呼吁大家保护环境。" 
                }
            ];
            aiMessages.innerHTML = '<div class="ai-message ai-message-bot">你好！我是这片红树林的AI导游，关于植物、鸟类、鱼类、虫子或者环保的问题，你都可以问我哦。</div>';
            saveChatHistory();
        }
    });

    function saveChatHistory() {
        const clone = aiMessages.cloneNode(true);
        const loadingElements = clone.querySelectorAll('.ai-message-loading');
        loadingElements.forEach(el => el.remove());
        localStorage.setItem('mangroveChatHistory', clone.innerHTML);
    }

    function loadChatHistory() {
        const saved = localStorage.getItem('mangroveChatHistory');
        if (saved) {
            aiMessages.innerHTML = saved;
            const loadingElements = aiMessages.querySelectorAll('.ai-message-loading');
            loadingElements.forEach(el => el.remove());
            aiMessages.scrollTop = aiMessages.scrollHeight;
        }
    }

    loadChatHistory();

    async function sendAIMessage() {
        const text = aiInput.value.trim();
        if (!text || isAILoading) return;

        appendMessage('user', text);
        aiInput.value = '';
        isAILoading = true;

        chatHistory.push({ role: "user", content: text });
        if (chatHistory.length > 11) {
            chatHistory = [chatHistory[0], ...chatHistory.slice(-10)];
        }

        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'ai-message ai-message-loading';
        loadingDiv.textContent = '正在查阅红树林百科...';
        aiMessages.appendChild(loadingDiv);
        aiMessages.scrollTop = aiMessages.scrollHeight;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: MODEL,
                    messages: chatHistory
                })
            });

            const data = await response.json();
            
            aiMessages.removeChild(loadingDiv);

            if (data.choices && data.choices[0]) {
                const reply = data.choices[0].message.content;
                appendMessage('bot', reply);
                chatHistory.push({ role: "assistant", content: reply });
            } else {
                appendMessage('bot', '哎呀，我好像潜入深海迷路了，请稍后再试。');
            }

        } catch (error) {
            console.error("AI 请求失败:", error);
            if (aiMessages.contains(loadingDiv)) {
                aiMessages.removeChild(loadingDiv);
            }
            appendMessage('bot', '网络连接失败，请检查一下网络或API配置。');
        } finally {
            isAILoading = false;
            saveChatHistory();
        }
    }

    function appendMessage(role, text) {
        const msg = document.createElement('div');
        msg.className = `ai-message ai-message-${role}`;
        msg.textContent = text;
        aiMessages.appendChild(msg);
        aiMessages.scrollTop = aiMessages.scrollHeight;
        saveChatHistory();
    }

    aiSendBtn.addEventListener('click', sendAIMessage);
    aiInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendAIMessage();
    });
</script>
